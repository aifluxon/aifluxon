name: python-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bindings/python/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/python-release.yml"
      - "scripts/ci/**"
  push:
    branches: [main]
    paths:
      - "bindings/python/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/python-release.yml"
      - "scripts/ci/**"

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/ci/check_python_version_consistency.py
      - run: python -m pip install packaging
      - run: python scripts/ci/test_verify_python_wheels.py

  rust-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup update stable
      - run: rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Reject native TLS dependencies
        run: |
          for manifest in Cargo.toml bindings/python/Cargo.toml; do
            if cargo tree --manifest-path "$manifest" -i native-tls >/dev/null 2>&1; then
              echo "native-tls entered the dependency graph for $manifest" >&2
              exit 1
            fi
            if cargo tree --manifest-path "$manifest" -i openssl-sys >/dev/null 2>&1; then
              echo "openssl-sys entered the dependency graph for $manifest" >&2
              exit 1
            fi
          done

  rust-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup update stable
      - run: rustup default stable
      - run: cargo test --workspace --locked

  python-windows-x64:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Build editable extension and run Python tests
        working-directory: bindings/python
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install "maturin>=1.7,<2.0" pytest pytest-asyncio
          .\.venv\Scripts\python.exe -m maturin develop --release --locked
          .\.venv\Scripts\python.exe -m pytest -q

  python-linux-x64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build editable extension and run Python tests
        working-directory: bindings/python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install 'maturin>=1.7,<2.0' pytest pytest-asyncio
          .venv/bin/python -m maturin develop --release --locked
          .venv/bin/python -m pytest -q

  python-linux-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build editable extension and run Python tests
        working-directory: bindings/python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install 'maturin>=1.7,<2.0' pytest pytest-asyncio
          .venv/bin/python -m maturin develop --release --locked
          .venv/bin/python -m pytest -q
