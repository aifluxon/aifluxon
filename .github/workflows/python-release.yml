name: python-release

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish verified wheels from an existing run to production PyPI"
        type: boolean
        default: false
      source_run_id:
        description: "Workflow run ID that produced the TestPyPI-verified wheels"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.inputs.publish_to_pypi != 'true' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          working-directory: bindings/python
          target: x86_64-pc-windows-msvc
      - name: Reject non-Windows-x64 wheels
        shell: pwsh
        run: |
          $wheels = Get-ChildItem bindings/python/dist -Filter *.whl
          if (-not $wheels) { throw "No wheels produced" }
          foreach ($wheel in $wheels) {
            if ($wheel.Name -notmatch "win_amd64") {
              throw "Unexpected wheel platform: $($wheel.Name)"
            }
          }
          $wheels | ForEach-Object { $_.Name }
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-cp${{ matrix.python-version }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: ${{ github.event.inputs.publish_to_pypi != 'true' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List wheels
        run: ls -la dist && ls dist/*.whl
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: false

  publish-pypi:
    if: ${{ github.event.inputs.publish_to_pypi == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Require source run id
        if: ${{ inputs.source_run_id == '' }}
        run: |
          echo "source_run_id is required when publishing to production PyPI" >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          path: dist
          merge-multiple: true
      - name: Verify win_amd64 wheels only
        run: |
          set -euo pipefail
          ls -la dist
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No wheels downloaded from run ${{ inputs.source_run_id }}" >&2
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            echo "$wheel"
            case "$wheel" in
              *win_amd64.whl) ;;
              *)
                echo "Refusing non-win_amd64 artifact: $wheel" >&2
                exit 1
                ;;
            esac
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: false
