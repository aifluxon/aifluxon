[workspace]
resolver = "2"
members = [
  "crates/aifluxon-core",
  "crates/aifluxon-runtime",
  "crates/aifluxon-providers",
  "crates/aifluxon-auth",
  "crates/aifluxon-api",
]
exclude = ["bindings/python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aifluxon/aifluxon"
readme = "README.md"

[workspace.dependencies]
async-trait = "0.1"
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
