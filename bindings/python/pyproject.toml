[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "aifluxon"
version = "0.1.0"
description = "Python SDK for the AIFLUXON embedded agent backend"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AIFLUXON" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aifluxon/aifluxon"
Repository = "https://github.com/aifluxon/aifluxon"
Documentation = "https://github.com/aifluxon/aifluxon/blob/main/docs/python/README.md"
Issues = "https://github.com/aifluxon/aifluxon/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.maturin]
module-name = "aifluxon._native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.maturin.sbom]
rust = false
auditwheel = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["python"]
